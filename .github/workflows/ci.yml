name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t readystate:ci .

      - name: Docker rejects forbidden public assets
        run: |
          log=$(mktemp)
          trap 'rm -f public/package-canary.pem "$log"' EXIT
          printf '%s\n' 'synthetic package inspection fixture' > public/package-canary.pem
          if docker build --target build . > "$log" 2>&1; then
            echo 'Docker accepted a forbidden public asset.'
            exit 1
          fi
          grep -F 'Forbidden package path: public/package-canary.pem' "$log"

      - name: Start self-hosted and hosted containers
        run: |
          docker run -d --name selfhosted -p 3000:3000 readystate:ci
          docker run -d --name hosted -p 3001:3000 -e READYSTATE_MODE=hosted readystate:ci
          for port in 3000 3001; do
            for i in $(seq 1 30); do
              curl -fs "http://localhost:$port/api/config" > /dev/null && break
              sleep 1
            done
          done

      - name: Self-hosted mode serves config with providers
        run: |
          body=$(curl -fs http://localhost:3000/api/config)
          echo "$body"
          echo "$body" | jq -e '.mode == "self-hosted" and (.providers | length > 0)'
          curl -fs http://localhost:3000/file.svg > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:3000/_next/image?url=%2Ffile.svg&w=640&q=75')" = 404
          docker exec selfhosted node -e '
            const fs = require("fs");
            const assert = require("assert/strict");
            const walk = p => {
              for (const e of fs.readdirSync(p, { withFileTypes: true })) {
                assert.ok(!/^(sharp(?:-|$)|libvips)/i.test(e.name), e.name);
                if (e.isDirectory()) walk(p + "/" + e.name);
              }
            };
            walk("node_modules");'

      - name: Hosted mode fails closed
        run: |
          body=$(curl -fs http://localhost:3001/api/config)
          echo "$body"
          echo "$body" | jq -e '.mode == "hosted" and (.providers | length == 0)'
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{"messages":[]}' \
            http://localhost:3001/api/ttx)
          echo "POST /api/ttx -> $status"
          test "$status" = 503

      - name: Private Vercel trial access (no model calls)
        run: |
          docker run -d --name trial -p 3002:3000 \
            -e VERCEL=1 -e READYSTATE_TRIAL_PASSWORD=synthetic-trial-password-for-ci \
            -e READYSTATE_CAPTURE_DEBRIEF_DRAFTS=1 readystate:ci
          docker run -d --name unconfigured-trial -p 3003:3000 \
            -e VERCEL=1 readystate:ci
          for port in 3002 3003; do
            for i in $(seq 1 30); do
              curl -s -o /dev/null "http://localhost:$port/" && break
              sleep 1
            done
          done
          for path in / /journal /settings /api/config /api/ttx; do
            test "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3002$path")" = 401
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{}' http://localhost:3002/api/ttx)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3003/api/ttx)" = 503
          curl -fs -u trial:synthetic-trial-password-for-ci http://localhost:3002/api/config | \
            jq -e '.mode == "self-hosted"'
          curl -fs -u trial:synthetic-trial-password-for-ci \
            -H 'x-readystate-capture-debrief-drafts: 1' http://localhost:3002/api/ttx | \
            jq -e '.captureDebriefDrafts == false'
          curl -fs -u trial:synthetic-trial-password-for-ci http://localhost:3002/journal > /dev/null

      - name: Container logs
        if: always()
        run: |
          docker logs selfhosted || true
          docker logs hosted || true
          docker logs trial || true
          docker logs unconfigured-trial || true
