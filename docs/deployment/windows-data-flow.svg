<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title description">
  <title id="title">ReadyState local assessment and optional online exercises</title>
  <desc id="description">The browser connects to ReadyState on localhost. Household assessment stays local without a model. An explicitly sent exercise or debrief goes from the local server to Groq online. The API key authenticates the server request, not conversation text.</desc>
  <rect width="760" height="300" rx="16" fill="#f6f3eb"/>
  <g font-family="Arial, sans-serif" fill="#183734">
    <text x="28" y="34" font-size="20" font-weight="bold">Choose a local assessment or an optional online exercise</text>
    <rect x="28" y="64" width="190" height="96" rx="10" fill="#ffffff" stroke="#245c51" stroke-width="2"/>
    <text x="48" y="98" font-size="18" font-weight="bold">Your browser</text>
    <text x="48" y="126" font-size="15">Answers and settings</text>
    <path d="M230 110h42m-10-8 10 8-10 8" stroke="#245c51" stroke-width="3" fill="none"/>
    <rect x="284" y="64" width="215" height="96" rx="10" fill="#ffffff" stroke="#245c51" stroke-width="2"/>
    <text x="304" y="98" font-size="18" font-weight="bold">ReadyState server</text>
    <text x="304" y="126" font-size="15">On your Windows device</text>
    <path d="M510 110h38m-10-8 10 8-10 8" stroke="#245c51" stroke-width="3" stroke-dasharray="5 4" fill="none"/>
    <rect x="561" y="64" width="171" height="96" rx="10" fill="#ffffff" stroke="#245c51" stroke-width="2"/>
    <text x="581" y="98" font-size="18" font-weight="bold">Groq online</text>
    <text x="581" y="126" font-size="15">Optional AI model</text>
    <text x="28" y="197" font-size="16" font-weight="bold">Assessment: local rules, no account or model call</text>
    <text x="28" y="229" font-size="16">Exercise / debrief: online only when you explicitly send</text>
    <text x="28" y="261" font-size="15">The key authenticates requests; it is not conversation text.</text>
  </g>
</svg>
